name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json  # pnpm version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Answers come from a local stand-in, so CI needs no LLM key.
      COMPOSE_FILE: docker-compose.yml:docker-compose.stub.yml
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: API ready
        run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/api/v1/readyz
      - name: Web proxies API
        run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/api/v1/healthz
      - name: Provision a tenant
        run: >
          docker compose run --rm -e VEYL_ADMIN_PASSWORD=smoke-test-password migrate
          python -m app.cli provision-tenant --slug smoke --name "Smoke Test" --admin-email admin@smoke.test
      - name: Log in through the web proxy
        run: |
          curl -fsS -c jar.txt -H 'Content-Type: application/json'             -d '{"tenant_slug":"smoke","email":"admin@smoke.test","password":"smoke-test-password"}'             http://127.0.0.1:3000/api/v1/auth/login
          curl -fsS -b jar.txt http://127.0.0.1:3000/api/v1/auth/me
      - name: Dashboard pages render through the edge
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/chat)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt http://127.0.0.1:3000/chat)" = "200"
      - name: Upload and ingest a document
        run: sh docker/smoke/ingest.sh http://127.0.0.1:3000 jar.txt
      - name: Ask a question and get a cited answer
        run: sh docker/smoke/query.sh http://127.0.0.1:3000 jar.txt
      - name: Seed the two-company demo through the API
        run: docker compose run --rm -e VEYL_DEMO_PASSWORD=ci-demo-password seed
      - name: Demo permissions hold end to end
        run: sh docker/smoke/demo.sh http://127.0.0.1:3000 ci-demo-password
      - name: Forged X-Forwarded-For cannot evade the per-IP login limit
        run: sh docker/smoke/login-ip-limit.sh http://127.0.0.1:3000 21
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
