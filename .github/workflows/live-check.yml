name: Live check

# Run by hand against the deployed dashboard, from GitHub's network (an address no visitor
# shares). Afterwards this runner's address is rate-limited for 15 minutes; everyone else
# must still be able to sign in, which shows the limit is per visitor.
on:
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: Dashboard address, without a trailing slash
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASHBOARD_URL: ${{ inputs.dashboard_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The dashboard reaches the API
        run: curl -fsS --retry 10 --retry-delay 10 --retry-all-errors --max-time 120 "$DASHBOARD_URL/api/v1/readyz"
      - name: Forged X-Forwarded-For cannot evade the per-IP sign-in limit
        run: sh docker/smoke/login-ip-limit.sh "$DASHBOARD_URL" 21
