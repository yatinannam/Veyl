name: veyl

services:
  db:
    security_opt: ["no-new-privileges:true"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: veyl
      VEYL_OWNER_PASSWORD: ${VEYL_OWNER_PASSWORD:?set VEYL_OWNER_PASSWORD in .env}
      VEYL_APP_PASSWORD: ${VEYL_APP_PASSWORD:?set VEYL_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      # -h forces TCP: the init-phase temp server only listens on a socket.
      test: ["CMD-SHELL", "pg_isready -U postgres -d veyl -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://veyl_owner:${VEYL_OWNER_PASSWORD}@db:5432/veyl
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Demo data (spec section 14). Not started by `up`; run it once:
  #   docker compose run --rm -e VEYL_DEMO_PASSWORD=choose-a-demo-password seed
  # Creates the tenants with the owner role, then everything else through the API.
  seed:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build: ./backend
    profiles: ["demo"]
    command: ["python", "-m", "app.cli", "seed-demo", "--api-url", "http://api:8000"]
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://veyl_owner:${VEYL_OWNER_PASSWORD}@db:5432/veyl
      VEYL_DEMO_PASSWORD: ${VEYL_DEMO_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    restart: "no"

  api:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    build: ./backend
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Trust X-Forwarded-For so login rate limiting sees the browser's IP. The header is
      # authoritative because `edge` (Caddy) overwrites any client-supplied value and
      # Next.js forwards it unchanged. Only localhost can reach this port directly.
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    environment:
      DATABASE_URL: postgresql+psycopg://veyl_app:${VEYL_APP_PASSWORD}@db:5432/veyl
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?set AUDIT_HMAC_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      EMBEDDING_CACHE_DIR: /opt/models
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.5}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://veyl_app:${VEYL_APP_PASSWORD}@db:5432/veyl
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?set AUDIT_HMAC_KEY in .env}
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    # Not published: browsers reach the web app only through `edge`.

  edge:
    security_opt: ["no-new-privileges:true"]
    image: caddy:2-alpine
    user: "10001:10001"
    environment:
      XDG_CONFIG_HOME: /tmp/caddy/config
      XDG_DATA_HOME: /tmp/caddy/data
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
    ports:
      - "127.0.0.1:3000:8080"

volumes:
  pgdata:
  uploads:
